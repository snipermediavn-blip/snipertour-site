<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <!-- 只允許載入自己的檔案、固定版本的 supabase-js 和我們的 Supabase；擋掉被注入的外部程式 -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js https://challenges.cloudflare.com; connect-src 'self' https://zcvtqzjgmhsstbyzvuyo.supabase.co wss://zcvtqzjgmhsstbyzvuyo.supabase.co https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; media-src blob:; img-src 'self' https://zcvtqzjgmhsstbyzvuyo.supabase.co data: blob:; style-src 'self' 'unsafe-inline'; base-uri 'none'; form-action 'none'; object-src 'none'">
  <meta name="referrer" content="no-referrer">
  <!-- 不能被別的網站用 iframe 嵌入（GitHub Pages 不能送 X-Frame-Options，用這段擋） -->
  <style>html.framed body { display: none !important; }</style>
  <title>WQW 管理後台</title>
  <link rel="stylesheet" href="admin.css">
  <script src="frame-guard.js"></script>
  <!-- integrity：CDN 上的檔案被改過就不會執行 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"
          integrity="sha384-rwykjmWNwVxboyFmvK9OXN0wj9hnMHA2aAHtits54DuACyCq0M2PrSNxhRb+hvXT" crossorigin="anonymous"></script>
</head>
<body>
  <!-- 登入 -->
  <section id="login" class="login hidden">
    <div class="login-card">
      <div class="brand">◎ WQW <span>管理後台</span></div>
      <div id="login-phone-step">
        <label>手機號碼</label>
        <input id="login-phone" type="tel" placeholder="0901 234 567" autocomplete="tel">
        <label>密碼</label>
        <input id="login-password" type="password" autocomplete="current-password">
        <div id="login-captcha"></div>
        <button id="login-pw" class="btn gold">登入</button>
        <button id="login-send" class="btn link">忘記密碼／還沒設密碼？用 Zalo 驗證碼登入</button>
      </div>
      <div id="login-code-step" class="hidden">
        <label>簡訊驗證碼（6 位數）</label>
        <input id="login-code" type="text" inputmode="numeric" maxlength="6" autocomplete="one-time-code">
        <button id="login-verify" class="btn gold">登入</button>
        <button id="login-back" class="btn link">換手機號碼</button>
      </div>
      <!-- 兩步驟驗證（管理員一定要）：第一次掃 QR code 綁定手機驗證 App，之後每次輸入 6 位數 -->
      <div id="login-mfa-step" class="hidden">
        <p id="mfa-intro" class="muted"></p>
        <div id="mfa-qr"></div>
        <p id="mfa-secret" class="muted" style="word-break:break-all;font-size:12px"></p>
        <label>驗證 App 上的 6 位數</label>
        <input id="mfa-code" type="text" inputmode="numeric" maxlength="6" autocomplete="one-time-code">
        <button id="mfa-verify" class="btn gold">確認</button>
        <button id="mfa-cancel" class="btn link">登出</button>
      </div>
      <p id="login-msg" class="msg"></p>
    </div>
  </section>

  <!-- 後台 -->
  <section id="app" class="app hidden">
    <nav class="side">
      <div class="brand">◎ WQW <span>管理後台</span></div>
      <a href="#/overview" data-page="overview">總覽</a>
      <a href="#/levels" data-page="levels">等級審核</a>
      <a href="#/venues" data-page="venues">球館與員工</a>
      <a href="#/players" data-page="players">球員</a>
      <a href="#/members" data-page="members">會員名單</a>
      <a href="#/lucky" data-page="lucky">吉利號碼</a>
      <a href="#/flags" data-page="flags">可疑名單</a>
      <a href="#/disputes" data-page="disputes">比分爭議</a>
      <a href="#/reports" data-page="reports">檢舉</a>
      <a href="#/feedback" data-page="feedback">問題回報</a>
      <a href="#/otp" data-page="otp">驗證碼</a>
      <a href="#/rules" data-page="rules" data-roles="operator">積分規則與設定</a>
      <a href="#/release" data-page="release" data-roles="operator">版本與維護</a>
      <a href="#/configlog" data-page="configlog">設定修改紀錄</a>
      <a href="#/store" data-page="store" data-roles="operator">商城</a>
      <a href="#/orders" data-page="orders" data-roles="finance">訂單與退款</a>
      <a href="#/revenue" data-page="revenue" data-roles="finance">營收報表</a>
      <a href="#/roles" data-page="roles">後台角色</a>
      <a href="#/ads" data-page="ads">廣告</a>
      <a href="#/push" data-page="push">推播</a>
      <div class="side-foot">
        <div id="me-name" class="muted"></div>
        <button id="logout" class="btn small">登出</button>
      </div>
    </nav>
    <main id="page" class="page"></main>
  </section>

  <div id="toast" class="toast hidden"></div>
  <script src="admin.js"></script>
</body>
</html>
